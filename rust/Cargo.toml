[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "gotatun_jni"

[[bin]]
name = "bindgen"
path = "bindgen.rs"

[dependencies]
android_logger = "0.14"
base64 = "0.22"
gotatun = { version = "0.9.1", features = ["device"] }
ipnetwork = "0.21"
log = "0.4"
nix = "0.31.3"
tokio = { version = "1", features = ["full"] }
uniffi = { version = "0.32.0", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.32.0", features = ["build"] }

[features]
ffi-trace = ["uniffi/ffi-trace"]

# Strip embedded DWARF debug info from the .so on debug builds.
# This reduces the library from ~110 MB → ~10 MB.
# The binary is still fully debuggable via source-level stepping; the NDK
# keeps a separate .so with symbols in the build tree for symbolication.
[profile.dev]
strip = "debuginfo"

# Release builds: full optimisation + strip everything.
[profile.release]
opt-level = 3
strip = true
lto = true
